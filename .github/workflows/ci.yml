name: Enterprise ML Platform CI/CD

"on":
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Code Formatting & Linting Check (Ruff)
        run: |
          ruff check . --ignore E501

      - name: Execute Full Pytest Test Suite with Coverage
        run: |
          pytest --cov=. --cov-report=term-missing --cov-report=xml

  e2e-workflow-audit:
    name: Master E2E Workflow & API SLA Audit
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Master Workflow Orchestrator Script
        run: |
          python -m scripts.run_full_pipeline

      - name: Verify FastAPI SLA Latency < 50ms Benchmark Test
        run: |
          pytest tests/test_api.py -k test_latency_performance_guarantee

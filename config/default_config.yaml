project:
  name: "Enterprise Customer Intelligence & Churn Prediction Platform"
  version: "0.1.0"
  seed: 42

dataset:
  n_samples: 100000
  churn_rate: 0.18
  test_size: 0.20
  val_size: 0.10

model_training:
  cv_folds: 5
  primary_metric: "pr_auc"
  random_state: 42

mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "enterprise-churn-prediction"

serving:
  latency_budget_p95_ms: 200.0
  batch_size: 1000

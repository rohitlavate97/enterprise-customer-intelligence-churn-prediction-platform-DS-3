[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-prediction-platform"
version = "2.1.0"
description = "Enterprise Customer Intelligence & Churn Prediction Platform"
authors = [{ name = "Enterprise ML Architecture Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "shap>=0.43.0",
    "imbalanced-learn>=0.11.0",
    "joblib>=1.3.0",
    "scipy>=1.11.0",
    "mlflow>=2.8.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "black>=23.10.0",
    "pre-commit>=3.5.0",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "data*", "config*", "features*", "models*", "training*", "evaluation*", "explainability*", "deployment*", "api*", "dashboard*", "streaming*", "monitoring*", "utils*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["api", "config", "data", "evaluation", "explainability", "features", "models", "monitoring", "streaming", "training", "utils"]
omit = ["tests/*", "scripts/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
